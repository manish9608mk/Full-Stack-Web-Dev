<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Support</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 50%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .post {
            background: #e9ffe9;
            padding: 10px;
            border-left: 5px solid #28a745;
            margin: 10px 0;
            border-radius: 5px;
        }
        .quote {
            font-style: italic;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🌿 Mental Health Support 🌿</h1>
    <p>Share your thoughts anonymously and receive a positive quote!</p>

    <div class="container">
        <textarea id="thoughtInput" placeholder="Write your thoughts..."></textarea>
        <button onclick="postThought()">Post</button>

        <div id="thoughtsList"></div>
    </div>

    <script>
        const quotes = [
            "You are stronger than you think. 💪",
            "Every day is a new beginning. 🌅",
            "Believe in yourself, and magic will happen. ✨",
            "It's okay to not be okay. Take your time. ❤️",
            "You deserve happiness. Keep going! 🌟"
        ];

        function postThought() {
            let input = document.getElementById("thoughtInput");
            let thoughtsList = document.getElementById("thoughtsList");

            if (input.value.trim() === "") {
                alert("Please write something before posting.");
                return;
            }

            // Create a new post
            let postDiv = document.createElement("div");
            postDiv.className = "post";
            postDiv.innerHTML = `<p>${input.value}</p>`;

            // Add a random quote
            let quoteDiv = document.createElement("div");
            quoteDiv.className = "quote";
            quoteDiv.textContent = quotes[Math.floor(Math.random() * quotes.length)];

            postDiv.appendChild(quoteDiv);
            thoughtsList.prepend(postDiv);

            // Clear the input field
            input.value = "";
        }
    </script>

</body>
</html>
