<!-- 
JavaScript DOM Methods (Detailed Explanation)

DOM (Document Object Model) methods allow you to manipulate HTML elements dynamically, such as adding, removing, updating, or modifying attributes and styles. Below is a categorized and detailed breakdown of important DOM methods in JavaScript.

⸻

1. Methods for Selecting Elements

These methods are used to retrieve elements from the DOM.

Method	Description	Example
document.getElementById(id)	Selects an element by its id.	document.getElementById("demo")
document.getElementsByClassName(className)	Returns a collection of elements with the given class.	document.getElementsByClassName("myClass")
document.getElementsByTagName(tagName)	Returns a collection of elements with the given tag name.	document.getElementsByTagName("p")
document.querySelector(selector)	Returns the first element that matches the given CSS selector.	document.querySelector(".myClass")
document.querySelectorAll(selector)	Returns a NodeList of all elements that match the selector.	document.querySelectorAll("div p")

Example

<p id="demo">Hello</p>
<script>
    let element = document.getElementById("demo");
    console.log(element.innerText); // Output: Hello
</script>



⸻

2. Methods for Creating and Adding Elements

These methods allow you to create and insert elements into the DOM.

Method	Description	Example
document.createElement(tagName)	Creates a new element but doesn’t add it to the DOM yet.	document.createElement("p")
element.appendChild(newElement)	Adds a new element as the last child of the given element.	parent.appendChild(child)
element.insertBefore(newElement, referenceElement)	Inserts a new element before another existing element.	parent.insertBefore(newEl, refEl)
element.append(...nodes)	Adds multiple nodes at the end of an element.	div.append(child1, child2)
element.prepend(...nodes)	Adds nodes at the beginning of an element.	div.prepend(child1, child2)

Example

<div id="container"></div>

<script>
    let newPara = document.createElement("p");
    newPara.innerText = "This is a new paragraph.";
    
    let container = document.getElementById("container");
    container.appendChild(newPara); // Adds <p> inside <div>
</script>



⸻

3. Methods for Removing Elements

These methods help in deleting elements from the DOM.

Method	Description	Example
element.remove()	Removes an element from the DOM.	document.getElementById("demo").remove()
element.removeChild(child)	Removes a specific child element.	parent.removeChild(childElement)
element.replaceChild(newChild, oldChild)	Replaces an existing child with a new one.	parent.replaceChild(newEl, oldEl)

Example

<p id="demo">This will be removed.</p>

<script>
    let para = document.getElementById("demo");
    para.remove(); // Removes the paragraph
</script>



⸻

4. Methods for Modifying Attributes

These methods allow getting, setting, or removing attributes.

Method	Description	Example
element.hasAttribute(name)	Checks if an element has a specific attribute.	btn.hasAttribute("disabled")
element.getAttribute(name)	Gets the value of an attribute.	link.getAttribute("href")
element.setAttribute(name, value)	Sets or updates an attribute.	img.setAttribute("src", "image.jpg")
element.removeAttribute(name)	Removes an attribute.	input.removeAttribute("readonly")

Example

<a id="myLink" href="https://example.com">Click here</a>

<script>
    let link = document.getElementById("myLink");
    console.log(link.getAttribute("href")); // Output: https://example.com
    
    link.setAttribute("href", "https://newsite.com");
</script>



⸻

5. Methods for Working with Classes

Used to manipulate element classes dynamically.

Method	Description	Example
element.classList.add(className)	Adds a class to an element.	div.classList.add("active")
element.classList.remove(className)	Removes a class.	div.classList.remove("hidden")
element.classList.toggle(className)	Toggles a class (adds if missing, removes if present).	div.classList.toggle("dark-mode")
element.classList.contains(className)	Checks if an element has a specific class.	div.classList.contains("active")

Example

<button id="myButton">Click Me</button>

<script>
    let btn = document.getElementById("myButton");
    btn.classList.add("highlight"); // Adds the "highlight" class
</script>



⸻

6. Methods for Modifying Content

Used to change the content of elements.

Method	Description	Example
element.innerHTML	Gets or sets the HTML inside an element.	div.innerHTML = "<p>New Content</p>";
element.innerText	Gets or sets only the text inside an element.	p.innerText = "Hello!"
element.textContent	Similar to innerText, but ignores styling.	p.textContent = "Hello!"

Example

<div id="content">Old Content</div>

<script>
    let div = document.getElementById("content");
    div.innerHTML = "<b>New Content</b>"; // Changes HTML inside div
</script>



⸻

7. Event Listener Methods

Used to handle user interactions.

Method	Description	Example
element.addEventListener(event, function)	Attaches an event listener.	btn.addEventListener("click", myFunction);
element.removeEventListener(event, function)	Removes an event listener.	btn.removeEventListener("click", myFunction);

Example

<button id="myButton">Click Me</button>

<script>
    let btn = document.getElementById("myButton");
    btn.addEventListener("click", function() {
        alert("Button Clicked!");
    });
</script>



⸻

8. Methods for Scrolling and Dimensions

Used for handling page scrolling and dimensions.

Method	Description	Example
window.scrollTo(x, y)	Scrolls to a specific position.	window.scrollTo(0, 500);
window.scrollBy(x, y)	Scrolls relative to current position.	window.scrollBy(0, 100);
element.scrollIntoView()	Scrolls an element into view.	document.getElementById("section").scrollIntoView();



⸻

Final Thoughts

These DOM methods provide a powerful way to manipulate web pages dynamically. Let me know if you need examples or want an explanation of a specific method! 🚀
-->
