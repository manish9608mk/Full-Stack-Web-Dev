<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Support</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            color: #333;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 50%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }
        .hidden { display: none; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 5px;
        }
        .post {
            background: #e9ffe9;
            padding: 10px;
            border-left: 5px solid #28a745;
            margin: 10px 0;
            border-radius: 5px;
        }
        .quote {
            font-style: italic;
            color: #555;
            margin-top: 10px;
        }
        .likes {
            color: #ff4500;
            font-weight: bold;
            cursor: pointer;
        }
        .dark-mode {
            background-color: #222;
            color: #f5f5f5;
        }
        .dark-mode .container {
            background: #333;
            color: white;
        }
        .dark-mode button {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>

    <h1>🌿 Mental Health Support 🌿</h1>
    <p>Share your thoughts anonymously and receive support!</p>

    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    <button id="loginBtn" onclick="login()">🔑 Enter Your Name</button>
    <button id="logoutBtn" class="hidden" onclick="logout()">🚪 Logout</button>
    <p id="userInfo" class="hidden"></p>

    <div class="container hidden" id="postSection">
        <textarea id="thoughtInput" placeholder="Write your thoughts..."></textarea>
        <button onclick="postThought()">Post</button>

        <div id="thoughtsList"></div>
    </div>
      <footer>&#169 2025 Manish Kumar</footer>
    <script>
        const quotes = [
            "You are stronger than you think. 💪",
            "Every day is a new beginning. 🌅",
            "Believe in yourself, and magic will happen. ✨",
            "It's okay to not be okay. Take your time. ❤️",
            "You deserve happiness. Keep going! 🌟"
        ];

        function login() {
            let username = prompt("Enter your name:");
            if (username) {
                localStorage.setItem("username", username);
                document.getElementById("userInfo").textContent = `Logged in as ${username}`;
                document.getElementById("userInfo").classList.remove("hidden");
                document.getElementById("loginBtn").classList.add("hidden");
                document.getElementById("logoutBtn").classList.remove("hidden");
                document.getElementById("postSection").classList.remove("hidden");
                loadPosts();
            }
        }

        function logout() {
            localStorage.removeItem("username");
            document.getElementById("userInfo").classList.add("hidden");
            document.getElementById("loginBtn").classList.remove("hidden");
            document.getElementById("logoutBtn").classList.add("hidden");
            document.getElementById("postSection").classList.add("hidden");
            document.getElementById("thoughtsList").innerHTML = "";
        }

        function postThought() {
            let input = document.getElementById("thoughtInput");
            let username = localStorage.getItem("username");

            if (!username) {
                alert("Please enter your name first.");
                return;
            }
            if (input.value.trim() === "") {
                alert("Please write something before posting.");
                return;
            }

            let newPost = {
                text: input.value,
                quote: quotes[Math.floor(Math.random() * quotes.length)],
                likes: 0
            };

            let posts = JSON.parse(localStorage.getItem("posts")) || [];
            posts.unshift(newPost);
            localStorage.setItem("posts", JSON.stringify(posts));

            input.value = "";
            loadPosts();
        }

        function likePost(index) {
            let posts = JSON.parse(localStorage.getItem("posts")) || [];
            posts[index].likes += 1;
            localStorage.setItem("posts", JSON.stringify(posts));
            loadPosts();
        }

        function loadPosts() {
            let thoughtsList = document.getElementById("thoughtsList");
            thoughtsList.innerHTML = "";
            let posts = JSON.parse(localStorage.getItem("posts")) || [];

            posts.forEach((data, index) => {
                let postDiv = document.createElement("div");
                postDiv.className = "post";
                postDiv.innerHTML = `<p>${data.text}</p>
                                     <div class="quote">${data.quote}</div>
                                     <span class="likes" onclick="likePost(${index})">❤️ ${data.likes}</span>`;

                thoughtsList.appendChild(postDiv);
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        // Auto-login if user was already logged in
        window.onload = function() {
            let username = localStorage.getItem("username");
            if (username) {
                document.getElementById("userInfo").textContent = `Logged in as ${username}`;
                document.getElementById("userInfo").classList.remove("hidden");
                document.getElementById("loginBtn").classList.add("hidden");
                document.getElementById("logoutBtn").classList.remove("hidden");
                document.getElementById("postSection").classList.remove("hidden");
                loadPosts();
            }
        }
    </script>

</body>
</html>
